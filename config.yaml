project:
  name: proyecto_grafos_ice_challenge
  version: 4.2.2
  purpose: etapa de recoleccion y construccion solicitada por Quantathon CR 2026

data:
  verify_official_service: true
  geographic_crs: EPSG:4326
  metric_crs: EPSG:5367

topology:
  max_snap_distance_m: 300
  minimum_route_length_km: 0.01
  confidence:
    high_max_m: 75
    medium_max_m: 150
    low_max_m: 300
    medium_detour_ratio: 1.25
    low_detour_ratio: 1.60
    reject_detour_ratio: 2.00
  sensitivity_tolerances_m: [50, 75, 100, 125, 150, 200, 250, 300, 500, 750, 1000, 1500, 2500]

validation:
  allow_official_name_reinforcement: true
  official_name_max_snap_m: 300
  official_name_max_detour_ratio: 2.0
  extended_geospatial_max_snap_m: 250
  extended_geospatial_max_detour_ratio: 1.60

instances:
  sizes: [6, 8, 10, 12]
  require_connected: true
  allow_trees: true
  require_same_literal_region: true
  require_nested_induced_subgraphs: true

weights:
  formula: route_length_km * (voltage_kv / 230)
  normalization: none
  parallel_circuits: sum_distinct_geometries

maxcut:
  epsilon: 1.0e-9
